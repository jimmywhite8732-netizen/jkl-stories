<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.card{width:600px;height:600px;position:relative;overflow:hidden;background:#10305F;font-family:'Barlow',sans-serif}
.arch{position:absolute;right:-30px;bottom:0;width:330px;height:380px;background:#2D6B97;border-radius:165px 165px 0 0}
.me{position:absolute;right:-40px;bottom:0;height:400px;clip-path:polygon(0 0,100% 0,100% 100%,95px 100%,95px 230px,0 230px)}
.top{position:absolute;left:44px;top:40px;width:300px}
.lbl{margin:0;font-weight:600;font-size:20px;letter-spacing:5px;color:#8FC1E6;text-transform:uppercase}
.ttl{margin:14px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:58px;line-height:.95;color:#fff;text-transform:uppercase}
.play{position:absolute;left:44px;bottom:118px;width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tri{width:0;height:0;border-left:34px solid #10305F;border-top:21px solid transparent;border-bottom:21px solid transparent;margin-left:8px}
.cta{position:absolute;left:44px;bottom:48px;font-weight:600;font-size:22px;letter-spacing:4px;color:#fff;text-transform:uppercase}
.bar{position:absolute;left:0;top:0;width:600px;height:8px;background:#2D6B97}
</style></head><body><div class="card"><div class="bar"></div><div class="arch"></div>
<img class="me" src="jimmy_riser.png">
<div class="top"><p class="lbl">__LBL__</p><p class="ttl">__TTL__</p></div>
<div class="play"><div class="tri"></div></div><div class="cta">Watch now ›</div></div></body></html>
